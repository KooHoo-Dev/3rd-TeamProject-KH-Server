name: Deploy main to team2

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: team2-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build server
        run: dotnet build HelloServer/HelloServer.csproj --configuration Release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy through team2 deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" team2@"$DEPLOY_HOST" <<'REMOTE'
            set -euo pipefail
            git -C "$HOME/src" fetch origin main
            git -C "$HOME/src" switch main
            git -C "$HOME/src" pull --ff-only origin main
            "$HOME/deploy.sh"
          REMOTE

      - name: Verify ping
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: curl --fail --show-error --silent --retry 6 --retry-delay 5 "http://$DEPLOY_HOST:5002/ping"
